<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;color:#352522;font:14px Bairro,Arial,sans-serif}h3{font-size:14px;font-weight:500;margin:0 0 10px}
.area{padding:18px;border:1px dashed #AA7769;border-radius:18px;background:#FFF9F0;display:flex;flex-direction:column;align-items:flex-start;gap:10px}.area.over{background:#F2B293}
p{margin:0;line-height:1.5}small{color:#705B55;font-size:12px}button{font:inherit;font-weight:600;background:#BE422F;color:white;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;min-height:44px}
button:focus-visible{outline:3px solid #352522;outline-offset:3px}button:disabled{opacity:.6;cursor:wait}#remove{background:transparent;color:#9D3323;padding:8px}#status{overflow-wrap:anywhere}#status.error{color:#9D3323}input{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap}
</style></head><body>
<h3 id="label">Enviar arquivo</h3><div class="area" id="area" role="group" aria-labelledby="label">
<p>Toque para escolher ou arraste o arquivo aqui.</p><small id="help"></small>
<div class="actions"><button id="choose" type="button">Escolher arquivo</button><button id="remove" type="button" hidden>Remover</button></div>
<input id="file" type="file" aria-label="Selecionar arquivo"><p id="status" role="status" aria-live="polite">Nenhum arquivo selecionado.</p></div>
<script>
const byId=id=>document.getElementById(id);let args={},sequence=0;
const send=(type,extra={})=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
const height=()=>send('streamlit:setFrameHeight',{height:document.documentElement.scrollHeight});
const value=v=>send('streamlit:setComponentValue',{value:v,dataType:'json'});
function status(text,error=false){byId('status').textContent=text;byId('status').className=error?'error':'';height()}
function clear(){sequence++;byId('file').value='';byId('remove').hidden=true;value(null);status('Nenhum arquivo selecionado.')}
async function pick(fileList){
 const files=Array.from(fileList);if(!files.length)return;const current=++sequence;value(null);byId('remove').hidden=true;
 if(files.length>args.maxFiles){status('Selecione no máximo '+args.maxFiles+' arquivo(s).',true);return}
 if(files.some(file=>!args.extensions.includes(file.name.split('.').pop().toLowerCase()))){status('Formato não permitido. '+args.helpText,true);return}
 if(files.some(file=>!file.size||file.size>args.maxBytes)){status('Arquivo vazio ou acima do limite. '+args.helpText,true);return}
 byId('choose').disabled=true;status('Preparando arquivo…');
 try{const uploads=await Promise.all(files.map(file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({name:file.name,base64:reader.result.split(',')[1]});reader.onerror=reject;reader.readAsDataURL(file)})));
 if(current!==sequence)return;value(args.maxFiles>1?uploads:uploads[0]);byId('remove').hidden=false;status('Selecionado: '+files.map(f=>f.name).join(' · '));
 }catch(error){if(current===sequence)status('Não foi possível abrir o arquivo. Tente novamente.',true)}
 finally{byId('choose').disabled=false;height()}
}
window.addEventListener('message',event=>{if(event.source!==window.parent||event.data.type!=='streamlit:render')return;
 args=event.data.args;byId('label').textContent=args.label;byId('help').textContent=args.helpText;byId('file').accept=args.extensions.map(x=>'.'+x).join(',');byId('file').multiple=args.maxFiles>1;
 byId('choose').disabled=!!event.data.disabled;byId('remove').disabled=!!event.data.disabled;
 if(!document.getElementById('font')){const style=document.createElement('style');style.id='font';style.textContent='@font-face{font-family:Bairro;src:url("'+args.font+'") format("woff2")}';document.head.appendChild(style)}height();
});
byId('choose').onclick=()=>byId('file').click();byId('remove').onclick=clear;byId('file').onchange=event=>pick(event.target.files);
byId('area').ondragover=event=>{event.preventDefault();byId('area').classList.add('over')};byId('area').ondragleave=()=>byId('area').classList.remove('over');
byId('area').ondrop=event=>{event.preventDefault();byId('area').classList.remove('over');if(!byId('choose').disabled)pick(event.dataTransfer.files)};
new ResizeObserver(height).observe(document.body);send('streamlit:componentReady',{apiVersion:1});height();
</script></body></html>
